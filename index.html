<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melodify - Music Streaming Platform</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        spotify: {
                            base: '#121212',
                            elevated: '#181818',
                            highlight: '#282828',
                            green: '#1db954',
                            lightgreen: '#1ed760',
                            text: '#ffffff',
                            muted: '#b3b3b3',
                            darkmuted: '#717171'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-spotify-base text-spotify-text h-screen flex flex-col overflow-hidden">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Authentication Screen (Login / Signup) -->
    <div id="auth-screen" class="fixed inset-0 z-40 bg-spotify-base flex items-center justify-center p-4">
        <div class="bg-spotify-elevated w-full max-w-md p-8 rounded-2xl shadow-2xl border border-spotify-highlight">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-spotify-green/10 text-spotify-green text-3xl mb-3">
                    <i class="fa-solid fa-music"></i>
                </div>
                <h1 class="text-3xl font-bold tracking-tight">Melodify</h1>
                <p class="text-spotify-muted text-sm mt-1">Your sound, your rhythm, anytime.</p>
            </div>

            <!-- Tab Switcher -->
            <div class="flex bg-spotify-base p-1 rounded-xl mb-6 border border-spotify-highlight">
                <button id="tab-login" onclick="switchAuthTab('login')" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-spotify-elevated text-white transition shadow">Sign In</button>
                <button id="tab-signup" onclick="switchAuthTab('signup')" class="flex-1 py-2 text-sm font-semibold rounded-lg text-spotify-muted transition">Sign Up</button>
            </div>

            <!-- Login Form -->
            <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-spotify-muted mb-1">Email Address</label>
                    <input type="email" id="login-email" required placeholder="user@melodify.com" class="w-full bg-spotify-base border border-spotify-highlight rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-spotify-green transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-spotify-muted mb-1">Password</label>
                    <input type="password" id="login-password" required placeholder="••••••••" class="w-full bg-spotify-base border border-spotify-highlight rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-spotify-green transition">
                </div>
                <button type="submit" class="w-full bg-spotify-green hover:bg-spotify-lightgreen text-black font-bold py-3 rounded-xl transition shadow-lg mt-2">
                    Log In
                </button>
            </form>

            <!-- Signup Form -->
            <form id="form-signup" onsubmit="handleSignup(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-semibold uppercase text-spotify-muted mb-1">Full Name</label>
                    <input type="text" id="signup-name" required placeholder="John Doe" class="w-full bg-spotify-base border border-spotify-highlight rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-spotify-green transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-spotify-muted mb-1">Email Address</label>
                    <input type="email" id="signup-email" required placeholder="john@example.com" class="w-full bg-spotify-base border border-spotify-highlight rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-spotify-green transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-spotify-muted mb-1">Password</label>
                    <input type="password" id="signup-password" required placeholder="••••••••" class="w-full bg-spotify-base border border-spotify-highlight rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-spotify-green transition">
                </div>
                <button type="submit" class="w-full bg-spotify-green hover:bg-spotify-lightgreen text-black font-bold py-3 rounded-xl transition shadow-lg mt-2">
                    Create Account
                </button>
            </form>
        </div>
    </div>

    <!-- Main Application Interface -->
    <div id="app-container" class="flex-1 flex overflow-hidden hidden">
        <!-- Sidebar Navigation -->
        <aside id="sidebar" class="w-64 bg-black flex flex-col p-6 gap-6 flex-shrink-0 select-none">
            <!-- App Logo -->
            <div class="flex items-center gap-3 px-2">
                <div class="w-9 h-9 rounded-full bg-spotify-green flex items-center justify-center text-black font-bold text-lg">
                    <i class="fa-solid fa-music"></i>
                </div>
                <span class="text-xl font-bold tracking-tight">Melodify</span>
            </div>

            <!-- Navigation Links (Dynamic based on role) -->
            <nav id="nav-links" class="flex flex-col gap-1 flex-1 overflow-y-auto">
                <!-- Injected via JS -->
            </nav>

            <!-- User Quick Profile Footer -->
            <div class="pt-4 border-t border-spotify-highlight flex items-center justify-between">
                <div class="flex items-center gap-3 overflow-hidden">
                    <div id="user-avatar" class="w-10 h-10 rounded-full bg-spotify-elevated flex items-center justify-center font-bold text-spotify-green border border-spotify-highlight flex-shrink-0">
                        U
                    </div>
                    <div class="overflow-hidden">
                        <p id="sidebar-username" class="text-sm font-semibold truncate">User Name</p>
                        <p id="sidebar-role" class="text-xs text-spotify-muted capitalize">User</p>
                    </div>
                </div>
                <button onclick="logout()" title="Logout" class="text-spotify-muted hover:text-white p-2 transition">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col bg-spotify-base overflow-hidden relative">
            <!-- Top Header Bar -->
            <header class="h-16 bg-spotify-base/80 backdrop-blur-md px-8 flex items-center justify-between z-20 sticky top-0 border-b border-spotify-highlight/40">
                <div class="flex items-center gap-4">
                    <div class="flex gap-2">
                        <button onclick="history.back()" class="w-8 h-8 rounded-full bg-black/50 text-spotify-muted hover:text-white flex items-center justify-center transition"><i class="fa-solid fa-chevron-left text-xs"></i></button>
                        <button onclick="history.forward()" class="w-8 h-8 rounded-full bg-black/50 text-spotify-muted hover:text-white flex items-center justify-center transition"><i class="fa-solid fa-chevron-right text-xs"></i></button>
                    </div>
                    <h2 id="page-title" class="text-lg font-bold">Home</h2>
                </div>
                <div class="flex items-center gap-4">
                    <div id="header-search-container" class="relative hidden">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-spotify-muted text-sm"></i>
                        <input type="text" id="global-search-input" oninput="handleSearchInput(this.value)" placeholder="What do you want to listen to?" class="bg-spotify-elevated text-sm rounded-full pl-10 pr-4 py-2 w-72 border border-spotify-highlight focus:outline-none focus:border-white transition">
                    </div>
                    <div class="flex items-center gap-3 bg-spotify-elevated px-3 py-1.5 rounded-full border border-spotify-highlight">
                        <div class="w-7 h-7 rounded-full bg-spotify-green text-black font-bold text-xs flex items-center justify-center" id="header-user-initial">U</div>
                        <span id="header-username" class="text-xs font-semibold">User</span>
                    </div>
                </div>
            </header>

            <!-- Dynamic View Container -->
            <div id="main-view-container" class="flex-1 overflow-y-auto p-8 pb-32">
                <!-- Dynamic Content injected here -->
            </div>
        </main>
    </div>

    <!-- Sticky Bottom Music Player Bar -->
    <div id="music-player-bar" class="h-24 bg-black border-t border-spotify-highlight px-4 flex items-center justify-between z-30 hidden flex-shrink-0">
        <!-- Currently Playing Song Meta -->
        <div class="flex items-center gap-4 w-1/4 min-w-[200px]">
            <img id="player-cover" src="https://placehold.co/56x56/282828/1db954?text=Melodify" alt="Cover" class="w-14 h-14 rounded-lg object-cover shadow border border-spotify-highlight">
            <div class="overflow-hidden">
                <h4 id="player-song-title" class="text-sm font-semibold truncate cursor-pointer hover:underline">Select a song</h4>
                <p id="player-song-artist" class="text-xs text-spotify-muted truncate">Artist Name</p>
            </div>
            <button id="player-like-btn" onclick="toggleCurrentLike()" class="text-spotify-muted hover:text-white text-lg ml-2 transition">
                <i class="fa-regular fa-heart"></i>
            </button>
        </div>

        <!-- Player Controls & Timeline -->
        <div class="flex flex-col items-center gap-2 w-2/4 max-w-xl">
            <div class="flex items-center gap-6">
                <button id="player-shuffle-btn" onclick="toggleShuffle()" class="text-spotify-muted hover:text-white transition" title="Shuffle">
                    <i class="fa-solid fa-shuffle text-sm"></i>
                </button>
                <button onclick="playPreviousSong()" class="text-spotify-muted hover:text-white text-lg transition" title="Previous">
                    <i class="fa-solid fa-backward-step"></i>
                </button>
                <button id="player-play-btn" onclick="togglePlayPause()" class="w-10 h-10 rounded-full bg-white text-black flex items-center justify-center hover:scale-105 transition shadow-lg">
                    <i class="fa-solid fa-play ml-0.5"></i>
                </button>
                <button onclick="playNextSong()" class="text-spotify-muted hover:text-white text-lg transition" title="Next">
                    <i class="fa-solid fa-forward-step"></i>
                </button>
                <button id="player-loop-btn" onclick="toggleLoop()" class="text-spotify-muted hover:text-white transition" title="Loop">
                    <i class="fa-solid fa-repeat text-sm"></i>
                </button>
            </div>
            <div class="w-full flex items-center gap-3 text-xs text-spotify-muted">
                <span id="player-current-time">0:00</span>
                <div class="flex-1 relative group flex items-center cursor-pointer">
                    <input type="range" id="player-progress" value="0" min="0" max="100" step="0.1" oninput="seekAudio(this.value)" class="w-full h-1 bg-spotify-highlight rounded-lg appearance-none cursor-pointer custom-range slider-thumb">
                </div>
                <span id="player-duration">0:00</span>
            </div>
        </div>

        <!-- Volume & Extra Controls -->
        <div class="flex items-center justify-end gap-3 w-1/4 min-w-[200px]">
            <button onclick="toggleMute()" class="text-spotify-muted hover:text-white transition">
                <i id="volume-icon" class="fa-solid fa-volume-high text-sm"></i>
            </button>
            <input type="range" id="player-volume" value="100" min="0" max="100" oninput="adjustVolume(this.value)" class="w-24 h-1 bg-spotify-highlight rounded-lg appearance-none cursor-pointer custom-range slider-thumb">
        </div>
    </div>

    <!-- Hidden Audio Element -->
    <audio id="audio-element" ontimeupdate="updateAudioProgress()" onended="handleSongEnded()"></audio>

    <!-- Modals Container -->
    <div id="modal-container" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <!-- Injected dynamically -->
    </div>

    <!-- JavaScript Script Link -->
    <script src="script.js"></script>
</body>
</html>
